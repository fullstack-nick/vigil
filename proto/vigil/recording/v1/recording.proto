syntax = "proto3";

package vigil.recording.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/fullstack-nick/vigil/go/gen/vigil/recording/v1;recordingv1";

message StartRecordingCommand {
  string command_id = 1;
  string recording_id = 2;
  string attempt_id = 3;
  string creator_id = 4;
  string source_id = 5;
  uint32 max_duration_seconds = 6;
  google.protobuf.Timestamp requested_at = 7;
}

message RecordingStarted {
  string worker_id = 1;
  string job_name = 2;
}

message SegmentUploaded {
  uint32 segment_index = 1;
  string object_name = 2;
  uint64 byte_count = 3;
  string crc32c = 4;
  uint64 duration_millis = 5;
}

message RecordingFinalizing {
  uint32 segment_count = 1;
}

message RecordingCompleted {
  string object_name = 1;
  uint64 byte_count = 2;
  uint64 duration_millis = 3;
  uint32 segment_count = 4;
}

message RecordingFailed {
  string code = 1;
  string message = 2;
}

enum StopReason {
  STOP_REASON_UNSPECIFIED = 0;
  STOP_REASON_OPERATOR_REQUESTED = 1;
  STOP_REASON_CONSENT_REVOKED = 2;
  STOP_REASON_LEASE_EXPIRED = 3;
}

message RecordingStopped {
  StopReason reason = 1;
  string detail = 2;
}

message RecordingEvent {
  string event_id = 1;
  string recording_id = 2;
  string attempt_id = 3;
  uint64 sequence = 4;
  google.protobuf.Timestamp occurred_at = 5;

  oneof payload {
    RecordingStarted started = 10;
    SegmentUploaded segment_uploaded = 11;
    RecordingFinalizing finalizing = 12;
    RecordingCompleted completed = 13;
    RecordingFailed failed = 14;
    RecordingStopped stopped = 15;
  }
}

message AcquireRecordingLeaseRequest {
  string recording_id = 1;
  string attempt_id = 2;
  string worker_id = 3;
  string job_name = 4;
}

message AcquireRecordingLeaseResponse {
  bool authorized = 1;
  string denial_reason = 2;
  string source_url = 3;
  string storage_prefix = 4;
  google.protobuf.Timestamp lease_expires_at = 5;
}

message RenewRecordingLeaseRequest {
  string recording_id = 1;
  string attempt_id = 2;
  string worker_id = 3;
}

message RenewRecordingLeaseResponse {
  bool authorized = 1;
  string denial_reason = 2;
  google.protobuf.Timestamp lease_expires_at = 3;
}

message ReleaseRecordingLeaseRequest {
  string recording_id = 1;
  string attempt_id = 2;
  string worker_id = 3;
  string terminal_reason = 4;
}

message ReleaseRecordingLeaseResponse {
  bool released = 1;
}

service RecordingLeaseService {
  rpc AcquireRecordingLease(AcquireRecordingLeaseRequest) returns (AcquireRecordingLeaseResponse);
  rpc RenewRecordingLease(RenewRecordingLeaseRequest) returns (RenewRecordingLeaseResponse);
  rpc ReleaseRecordingLease(ReleaseRecordingLeaseRequest) returns (ReleaseRecordingLeaseResponse);
}

