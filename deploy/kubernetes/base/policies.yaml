apiVersion: v1
kind: ResourceQuota
metadata:
  name: vigil-runtime
spec:
  hard:
    count/jobs.batch: "6"
    requests.cpu: "8"
    requests.memory: 12Gi
    requests.ephemeral-storage: 18Gi
    limits.cpu: "16"
    limits.memory: 24Gi
    limits.ephemeral-storage: 30Gi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-runtime-metrics
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values: ["backend-worker", "scheduler"]
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: gmp-system
      ports:
        - protocol: TCP
          port: 9090
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-recorder-to-source
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: synthetic-hls
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              component: recorder
      ports:
        - protocol: TCP
          port: 8080
    - from:
        - ipBlock:
            cidr: 35.191.0.0/16
        - ipBlock:
            cidr: 130.211.0.0/22
      ports:
        - protocol: TCP
          port: 8080

