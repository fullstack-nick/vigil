apiVersion: apps/v1
kind: Deployment
metadata:
  name: vigil-scheduler
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: vigil
      app.kubernetes.io/component: scheduler
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vigil
        app.kubernetes.io/component: scheduler
    spec:
      serviceAccountName: vigil-scheduler
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: scheduler
          image: vigil/go:deploy
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: vigil-runtime
          ports:
            - name: metrics
              containerPort: 9090
          readinessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
              ephemeral-storage: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
              ephemeral-storage: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: vigil-scheduler
spec:
  selector:
    app.kubernetes.io/name: vigil
    app.kubernetes.io/component: scheduler
  ports:
    - name: metrics
      port: 9090
      targetPort: metrics

