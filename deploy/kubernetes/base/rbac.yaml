apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: vigil-scheduler
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "update", "patch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: vigil-scheduler
subjects:
  - kind: ServiceAccount
    name: vigil-scheduler
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: vigil-scheduler

