apiVersion: apps/v1
kind: Deployment
metadata:
  name: vigil-synthetic-hls
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vigil
      app.kubernetes.io/component: synthetic-hls
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vigil
        app.kubernetes.io/component: synthetic-hls
    spec:
      serviceAccountName: vigil-synthetic-hls
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: source
          image: vigil/synthetic-hls:deploy
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 4
            periodSeconds: 5
          resources:
            requests:
              cpu: 500m
              memory: 384Mi
              ephemeral-storage: 512Mi
            limits:
              cpu: "2"
              memory: 768Mi
              ephemeral-storage: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: hls
              mountPath: /srv/hls
            - name: nginx-tmp
              mountPath: /tmp/nginx
      volumes:
        - name: hls
          emptyDir:
            sizeLimit: 768Mi
        - name: nginx-tmp
          emptyDir:
            sizeLimit: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: vigil-synthetic-hls
  annotations:
    networking.gke.io/load-balancer-type: Internal
spec:
  type: LoadBalancer
  loadBalancerIP: 10.42.0.20
  selector:
    app.kubernetes.io/name: vigil
    app.kubernetes.io/component: synthetic-hls
  ports:
    - name: http
      port: 8080
      targetPort: http

